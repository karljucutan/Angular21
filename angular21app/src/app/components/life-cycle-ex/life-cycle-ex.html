<section class="card">
	<div class="card-body">
		<h2 class="h4 mb-2">Common Angular Lifecycle Hooks</h2>
		<p class="text-secondary mb-3">
			This component implements: <code>OnInit</code>, <code>DoCheck</code>, <code>AfterContentInit</code>,
			<code>AfterContentChecked</code>, <code>AfterViewInit</code>, <code>AfterViewChecked</code>, and
			<code>OnDestroy</code>.
		</p>

		<button class="btn btn-primary btn-sm mb-3" (click)="triggerCheckCycle()" type="button">
			Trigger Change Detection Cycle
		</button>

		<ol class="list-group list-group-numbered">
			@for (log of lifecycleLogs(); track $index) {
				<li class="list-group-item">{{ log }}</li>
			}
		</ol>
	</div>
</section>
